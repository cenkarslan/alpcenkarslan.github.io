<script>
"use strict";
/* ================================================================
   TEKNOPOLİTİKA · Putin'in Valdai 2026 AI konuşması — analitik video
   Deterministik motor: renderFrame(t) her zaman aynı kareyi üretir.
   ================================================================ */
const W = 1080, H = 1920, FPS = 30, DUR = 60;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const C = {
  bg: "#06080B", ink: "#ECE8E0", dim: "#8B919A", mute: "#5A6069",
  hair: "rgba(236,232,224,0.16)",
  src: "#C9A15B",      // KAYNAK — Putin'in söyledikleri
  mean: "#C8D2DE",     // ANLAM
  ana: "#5CC8C0",      // TEKNOPOLİTİKA analizi
  alert: "#D5563F", phos: "#8CC79A", elec: "#CFEFFF"
};
const F = { d: '"TP Display"', s: '"TP Sans"', r: '"TP Serif"', m: '"TP Mono"' };

// Layout (1080×1920, sosyal medya güvenli alanı içinde)
const L = { x: 80, r: 1000, vx: 80, vy: 292, vw: 920, vh: 700, hy: 1040, ltY: 1338, ltW: 860 };

/* ---------------- yardımcılar ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eExp = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const fract = v => v - Math.floor(v);
function win(t, a, b, fi = .35, fo = .35) {
  if (t < a || t > b) return 0;
  return Math.min(fi > 0 ? eOut(prog(t, a, a + fi)) : 1, fo > 0 ? 1 - eIn(prog(t, b - fo, b)) : 1);
}
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = s; x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

function setFont(o) { ctx.font = `${o.it ? "italic " : ""}${o.w || 400} ${o.size}px ${o.f || F.s}`; ctx.letterSpacing = (o.ls || 0) + "px"; }
function text(s, x, y, o) {
  ctx.save(); setFont(o);
  ctx.fillStyle = o.c || C.ink; ctx.globalAlpha *= (o.a ?? 1);
  ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, o) { ctx.save(); setFont(o); const w = ctx.measureText(s).width; ctx.restore(); return w; }
function fit(s, o, maxW, maxSize) { const w = measure(s, { ...o, size: 100 }); return Math.min(maxSize, 100 * maxW / w); }
function wrap(s, o, maxW) {
  const words = s.split(" "), lines = []; let cur = "";
  for (const w of words) { const tryS = cur ? cur + " " + w : w; if (measure(tryS, o) > maxW && cur) { lines.push(cur); cur = w; } else cur = tryS; }
  if (cur) lines.push(cur); return lines;
}
function line(x1, y1, x2, y2, c, w = 1, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function dot(x, y, r, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function glow(x, y, r, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }
function polyPrefix(pts, k) {
  if (k <= 0 || pts.length < 2) return;
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  let rem = total * clamp(k); ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (rem >= seg[i - 1]) { ctx.lineTo(pts[i][0], pts[i][1]); rem -= seg[i - 1]; }
    else { const f = rem / seg[i - 1]; ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); break; }
  }
  ctx.stroke();
}
function clipRect(r) { ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip(); }
const VR = { x: L.vx, y: L.vy, w: L.vw, h: L.vh };

/* ---------------- grenli film dokusu ---------------- */
const grains = [];
(function () {
  const R = rng(7);
  for (let k = 0; k < 8; k++) {
    const g = document.createElement("canvas"); g.width = 540; g.height = 960;
    const gx = g.getContext("2d"), id = gx.createImageData(540, 960);
    for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    gx.putImageData(id, 0, 0); grains.push(g);
  }
})();
function grain(t, a, r) {
  const g = grains[Math.floor(t * FPS) % grains.length];
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = "overlay";
  if (r) { clipRect(r); ctx.drawImage(g, r.x, r.y, r.w, r.h); } else ctx.drawImage(g, 0, 0, W, H);
  ctx.restore();
}

/* ---------------- isteğe bağlı gerçek kaynak görüntü ----------------
   ?plate=dosya.mp4 ile lisanslı konuşma görüntüsü (ör. kremlin.ru, CC BY 4.0)
   kaynak karesinin içine yerleştirilir; yoksa temsili siluet çizilir. */
let plateVideo = null;
const plateSrc = new URLSearchParams(location.search).get("plate");
if (plateSrc) {
  plateVideo = document.createElement("video");
  plateVideo.src = plateSrc; plateVideo.muted = true; plateVideo.preload = "auto"; plateVideo.playsInline = true;
}
async function seekPlate(t) {
  if (!plateVideo || !plateVideo.duration) return;
  const target = (t * 0.9) % Math.max(0.1, plateVideo.duration - 0.1);
  if (Math.abs(plateVideo.currentTime - target) < 0.001) return;
  await new Promise(res => { plateVideo.addEventListener("seeked", res, { once: true }); plateVideo.currentTime = target; });
}

/* ================================================================
   GÖRSEL MODÜLLER
   ================================================================ */

/* — Kaynak karesi: Valdai konuşması (Putin, kaynak olarak; asla kahramanlaştırılmadan) — */
function sourcePlate(t, r, o = {}) {
  ctx.save(); clipRect(r);
  const flick = 0.92 + 0.08 * hash(Math.floor(t * 12));
  if (plateVideo && plateVideo.readyState >= 2) {
    const vw = plateVideo.videoWidth, vh = plateVideo.videoHeight, s = Math.max(r.w / vw, r.h / vh);
    ctx.filter = "grayscale(0.75) contrast(1.08) brightness(0.72) sepia(0.15)";
    ctx.drawImage(plateVideo, r.x + (r.w - vw * s) / 2, r.y + (r.h - vh * s) / 2, vw * s, vh * s);
    ctx.filter = "none";
  } else {
    // sahne: koyu, sıcak-gri; Valdai sahnesini çağrıştıran yatay ışık panelleri
    const bg = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    bg.addColorStop(0, "#17150f"); bg.addColorStop(.55, "#0f0e0b"); bg.addColorStop(1, "#080706");
    ctx.fillStyle = bg; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.globalAlpha = 0.5 * flick;
    for (let i = 0; i < 6; i++) {
      const px = r.x + r.w * (0.06 + i * 0.16), pw = r.w * 0.12;
      const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h * .7);
      g.addColorStop(0, "rgba(120,130,150,0.10)"); g.addColorStop(1, "rgba(120,130,150,0.0)");
      ctx.fillStyle = g; ctx.fillRect(px, r.y + r.h * .08, pw, r.h * .6);
    }
    ctx.globalAlpha = 1;
    // soğuk arka ışık
    glow(r.x + r.w * .52, r.y + r.h * .34, r.w * .55, "rgba(130,138,155,0.30)");
    // figür — göz hizasında, kadrajın içinde küçük; yüz detayı yok
    const s = r.w / 920, cx = r.x + r.w * .40 + Math.sin(t * 1.1) * 2 * s, base = r.y + r.h;
    const headY = r.y + r.h * .42 + Math.sin(t * 2.3) * 1.5 * s + Math.max(0, Math.sin(t * 3.1)) * 2 * s;
    ctx.fillStyle = "#121110";
    ctx.beginPath(); // omuzlar/gövde
    ctx.moveTo(cx - 150 * s, base); ctx.bezierCurveTo(cx - 150 * s, headY + 120 * s, cx - 120 * s, headY + 78 * s, cx - 52 * s, headY + 70 * s);
    ctx.lineTo(cx + 52 * s, headY + 70 * s); ctx.bezierCurveTo(cx + 120 * s, headY + 78 * s, cx + 150 * s, headY + 120 * s, cx + 150 * s, base); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, headY, 40 * s, 52 * s, 0, 0, Math.PI * 2); ctx.fill(); // baş
    ctx.fillRect(cx - 18 * s, headY + 40 * s, 36 * s, 34 * s); // boyun
    // kenar ışığı
    ctx.strokeStyle = "rgba(200,205,215,0.40)"; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.ellipse(cx, headY, 40 * s, 52 * s, 0, -Math.PI * .1, Math.PI * .45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 52 * s, headY + 70 * s); ctx.bezierCurveTo(cx + 120 * s, headY + 78 * s, cx + 150 * s, headY + 120 * s, cx + 150 * s, base); ctx.stroke();
    // kürsü + mikrofon
    ctx.fillStyle = "#1b1914";
    ctx.beginPath(); ctx.moveTo(cx - 210 * s, base); ctx.lineTo(cx - 180 * s, base - 190 * s); ctx.lineTo(cx + 180 * s, base - 190 * s); ctx.lineTo(cx + 210 * s, base); ctx.fill();
    ctx.fillStyle = "rgba(200,190,170,0.08)"; ctx.fillRect(cx - 180 * s, base - 190 * s, 360 * s, 6 * s);
    line(cx + 30 * s, base - 190 * s, cx + 8 * s, headY + 96 * s, "#2b2924", 4 * s);
    dot(cx + 8 * s, headY + 94 * s, 6 * s, "#2b2924");
    // ön planda masa/katılımcı silüetleri (bulanık)
    ctx.fillStyle = "rgba(5,5,4,0.85)";
    ctx.beginPath(); ctx.ellipse(r.x + r.w * .9, base + 10 * s, 120 * s, 90 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
  // arşiv dokusu: tarama çizgileri + titreşim + vinyet
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  for (let y = r.y; y < r.y + r.h; y += 4) ctx.fillRect(r.x, y, r.w, 1);
  ctx.fillStyle = `rgba(255,240,210,${0.035 * (1 - flick) * 10})`; ctx.fillRect(r.x, r.y, r.w, r.h);
  const vg = ctx.createRadialGradient(r.x + r.w / 2, r.y + r.h / 2, r.h * .25, r.x + r.w / 2, r.y + r.h / 2, r.w * .75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.65)"); ctx.fillStyle = vg; ctx.fillRect(r.x, r.y, r.w, r.h);
  grain(t, .32, r);
  ctx.restore();
  // künye — Putin = kaynak (amber)
  const k = r.w / 920, m = 22 * k, fs = Math.max(13, 17 * k);
  if (!o.mini) {
    text("KAYNAK GÖRÜNTÜ", r.x + m, r.y + m + fs, { f: F.m, w: 600, size: fs, c: C.src, ls: 2 });
    text(o.label || "PUTİN · VALDAI KONUŞMASI", r.x + m, r.y + m + fs * 2.4, { f: F.m, w: 400, size: fs, c: C.ink, a: .85, ls: 1 });
    text("VALDAI TARTIŞMA KULÜBÜ · XXIII. YILLIK TOPLANTI", r.x + m, r.y + r.h - m - fs * 1.5, { f: F.m, size: fs * .9, c: C.ink, a: .7, ls: 1 });
    text("01.10.2026 · PLENER OTURUM", r.x + m, r.y + r.h - m, { f: F.m, size: fs * .9, c: C.dim, ls: 1 });
  } else {
    text("KAYNAK · VALDAI 01.10.2026", r.x + 12, r.y + 24, { f: F.m, w: 600, size: 14, c: C.src, ls: 1.5 });
  }
  // konuşma göstergesi (ses dalgası)
  const bx = r.x + r.w - m - (o.mini ? 60 : 110) * k, by = r.y + r.h - m - (o.mini ? 0 : 6);
  for (let i = 0; i < 10; i++) {
    const hgt = (4 + 26 * Math.abs(Math.sin(t * 7.3 + i * 1.7) * Math.sin(t * 2.1 + i))) * (o.mini ? .5 : k);
    ctx.fillStyle = rgba(C.src, .85); ctx.fillRect(bx + i * 10 * k, by - hgt, 4 * k, hgt);
  }
  if (!o.mini) {
    const tc = 2783 + t; const mm = String(Math.floor(tc / 60)).padStart(2, "0"), ss = String(Math.floor(tc % 60)).padStart(2, "0"), ff = String(Math.floor((tc % 1) * 25)).padStart(2, "0");
    text(`● ${mm}:${ss}:${ff}`, r.x + r.w - m, r.y + m + fs, { f: F.m, size: fs, c: C.alert, a: .9, align: "right", ls: 1 });
  }
  ctx.save(); ctx.strokeStyle = rgba(C.src, .55); ctx.lineWidth = 1.5; ctx.strokeRect(r.x + .75, r.y + .75, r.w - 1.5, r.h - 1.5); ctx.restore();
}

/* — Sinir ağı / hesaplama — */
const NN = (() => {
  const R = rng(11), layers = [6, 10, 12, 10, 4], nodes = [], edges = [];
  layers.forEach((n, li) => { for (let i = 0; i < n; i++) nodes.push({ l: li, u: li / (layers.length - 1), v: (i + .5) / n + (R() - .5) * .02 }); });
  let off = 0; const idx = [];
  layers.forEach(n => { idx.push(off); off += n; });
  for (let li = 0; li < layers.length - 1; li++)
    for (let i = 0; i < layers[li]; i++) for (let j = 0; j < layers[li + 1]; j++) if (R() < .55) edges.push([idx[li] + i, idx[li + 1] + j, R()]);
  return { nodes, edges };
})();
function neural(t, r, o = {}) {
  const sc = o.scale || 1, cx = r.x + r.w / 2, cy = r.y + r.h / 2, sp = o.speed || 1;
  const P = n => [cx + (n.u - .5) * r.w * .8 * sc, cy + (n.v - .5) * r.h * .78 * sc];
  ctx.save(); ctx.lineWidth = 1;
  for (const e of NN.edges) { const a = P(NN.nodes[e[0]]), b = P(NN.nodes[e[1]]); ctx.strokeStyle = `rgba(160,200,215,${.05 + .06 * e[2]})`; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  for (let k = 0; k < 90; k++) {
    const e = NN.edges[(k * 37) % NN.edges.length], f = fract(t * sp * (.8 + hash(k) * 1.6) + hash(k + 9));
    const a = P(NN.nodes[e[0]]), b = P(NN.nodes[e[1]]);
    dot(lerp(a[0], b[0], f), lerp(a[1], b[1], f), 2.2, C.elec, .85 * Math.sin(f * Math.PI));
  }
  NN.nodes.forEach((n, i) => { const p = P(n), act = .4 + .6 * Math.max(0, Math.sin(t * 6 * sp + i)); dot(p[0], p[1], 5 * Math.min(sc, 1.6), "#0b1116"); ctx.strokeStyle = `rgba(207,239,255,${.35 + .5 * act})`; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(p[0], p[1], 5 * Math.min(sc, 1.6), 0, 7); ctx.stroke(); });
  ctx.restore();
}
function tokenRain(t, r, a = 1) {
  const chars = "0123456789ABCDEF∑∫λθ·×÷", cols = Math.floor(r.w / 30);
  ctx.save(); clipRect(r); ctx.font = `400 16px ${F.m}`; ctx.textAlign = "center";
  for (let c = 0; c < cols; c++) {
    const sp = 260 + hash(c) * 420, off = hash(c + 50) * r.h, x = r.x + 15 + c * 30;
    for (let k = 0; k < 18; k++) {
      const y = r.y + ((off + t * sp + k * 22) % (r.h + 60)) - 30;
      const ch = chars[Math.floor(hash(c * 31 + k + Math.floor(t * 18)) * chars.length)];
      ctx.fillStyle = `rgba(150,205,220,${a * (.05 + .22 * (k / 18))})`; ctx.fillText(ch, x, y);
    }
  }
  ctx.restore();
}

/* — İnsan beyni: tek çizgi kontur — */
const BRAIN = (() => {
  const outer = [], gyri = [];
  for (let i = 0; i <= 220; i++) {
    const th = Math.PI + (i / 220) * Math.PI * 2;
    let rr = 1 + .045 * Math.sin(th * 9) + .03 * Math.sin(th * 15 + 1);
    let x = Math.cos(th) * 1.3 * rr, y = Math.sin(th) * .88 * rr;
    if (y > .25) y = .25 + (y - .25) * .45; // düzleşen alt yüzey
    outer.push([x, y]);
  }
  for (let g = 0; g < 5; g++) {
    const pts = [], y0 = -.55 + g * .2;
    for (let i = 0; i <= 50; i++) { const u = i / 50; pts.push([-1.0 + u * 2.0 * (1 - Math.abs(y0) * .4), y0 + .06 * Math.sin(u * 18 + g * 2) + .04 * Math.sin(u * 7)]); }
    gyri.push(pts);
  }
  const cereb = []; for (let i = 0; i <= 60; i++) { const th = i / 60 * Math.PI * 2; cereb.push([.85 + Math.cos(th) * .32, .42 + Math.sin(th) * .17]); }
  const stem = [[.42, .3], [.5, .7], [.62, .78]];
  return { outer, gyri, cereb, stem };
})();
function brain(t, r, k = 1, a = 1, pulse = true) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2 - 6, s = Math.min(r.w / 3.2, r.h / 2.2);
  const map = pts => pts.map(p => [cx + p[0] * s, cy + p[1] * s]);
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.lineCap = "round";
  polyPrefix(map(BRAIN.outer), k);
  ctx.strokeStyle = "rgba(236,232,224,0.45)"; ctx.lineWidth = 1.3;
  BRAIN.gyri.forEach((g, i) => polyPrefix(map(g), clamp(k * 1.4 - .2 - i * .06)));
  polyPrefix(map(BRAIN.cereb), clamp(k * 1.3 - .3)); polyPrefix(map(BRAIN.stem), clamp(k * 1.5 - .5));
  if (pulse && k > .6) {

const GLOBE = (() => { const R = rng(23), pts = []; for (let i = 0; i < 46; i++) { const lat = (R() * 1.6 - .8) * Math.PI / 2 * 1.1, lon = R() * Math.PI * 2; pts.push([Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)]); } const arcs = []; for (let i = 0; i < 34; i++) arcs.push([Math.floor(R() * 46), Math.floor(R() * 46), R()]); return { pts, arcs }; })();

  const proj = v => { let [x, y, z] = v; const c = Math.cos(rot), s = Math.sin(rot); [x, z] = [x * c + z * s, -x * s + z * c]; const ct = Math.cos(tilt), st = Math.sin(tilt); [y, z] = [y * ct - z * st, y * st + z * ct]; return [cx + x * R, cy - y * R, z]; };
  ctx.save(); ctx.globalAlpha *= a;
  glow(cx, cy, R * 1.25, "rgba(92,200,192,0.08)");
  ctx.strokeStyle = "rgba(200,215,230,0.18)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  const seg = (pts) => { for (let i = 1; i < pts.length; i++) { const p = pts[i - 1], q = pts[i]; if (p[2] > 0 && q[2] > 0) { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); } } };
  ctx.beginPath();
  for (let m = 0; m < 12; m++) { const lon = m / 12 * Math.PI * 2, pts = []; for (let i = 0; i <= 40; i++) { const lat = -Math.PI / 2 + i / 40 * Math.PI; pts.push(proj([Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)])); } seg(pts); }
  for (let p = -2; p <= 2; p++) { const lat = p * Math.PI / 7, pts = []; for (let i = 0; i <= 60; i++) { const lon = i / 60 * Math.PI * 2; pts.push(proj([Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)])); } seg(pts); }
  ctx.strokeStyle = "rgba(200,215,230,0.10)"; ctx.stroke();
  GLOBE.arcs.forEach(([i, j, s], n) => {
    const A = GLOBE.pts[i], B = GLOBE.pts[j], pts = [];
    for (let q = 0; q <= 30; q++) { const u = q / 30, v = [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)], l = Math.hypot(...v) || 1, lift = 1 + .18 * Math.sin(u * Math.PI); pts.push(proj(v.map(c => c / l * lift))); }

  ctx.restore();
}

  text("MAKİNE HESAPLAMASI", top.x + 22, top.y + 38, { f: F.m, w: 600, size: 18, c: C.elec, ls: 3, a: 1 - judge * .45 });
  text("ölçek · hız · örüntü", top.x + 22, top.y + 62, { f: F.m, size: 15, c: C.dim, ls: 1, a: 1 - judge * .45 });
  line(VR.x, VR.y + 350, VR.x + VR.w, VR.y + 350, C.hair, 1);
  text("/", VR.x + VR.w / 2, VR.y + 362, { f: F.r, w: 400, size: 44, c: C.dim, align: "center" });
  ctx.save(); clipRect(bot);
  brain(t, { x: bot.x, y: bot.y + 10, w: bot.w, h: bot.h - 40 }, t < 6.3 ? 1 : 1, .55 + .45 * judge);
  ctx.restore();
  text("İNSAN MUHAKEMESİ", bot.x + 22, bot.y + 38, { f: F.m, w: 600, size: 18, c: judge > .5 ? C.ana : C.ink, ls: 3, a: .6 + .4 * judge });
  const tags = ["BAĞLAM", "ŞÜPHE", "SORUMLULUK"];
  tags.forEach((s, i) => text(s, bot.x + bot.w - 22, bot.y + 38 + i * 26, { f: F.m, size: 15, c: C.ana, align: "right", ls: 2, a: eOut(prog(t, 10.8 + i * .25, 11.3 + i * .25)) }));
  ctx.restore();
  frameMarks(t, VR, a);
  headline(t, 6.55, 10.1, [{ s: "AI HESAPLAYABİLİR.", w: 900, max: 112 }]);
  headline(t, 10.15, 14.95, [
    { s: "AMA MUHAKEME", f: F.r, it: true, w: 400, max: 112, gap: .02 },
    { s: "EDEBİLİR Mİ?", f: F.r, it: true, w: 400, max: 112, c: C.ana }
  ]);
}

function scenePetrov(t) {
  if (t < 14.9 || t > 25.4) return;
  const a = win(t, 15.0, 25.3, .45, .3);
  const st = { detect: prog(t, 16.8, 18.4), falseK: eOut(prog(t, 20.4, 21.0)) };
  ctx.save(); ctx.globalAlpha = a;
  const ra = 1 - eIO(prog(t, 21.75, 22.2));
  if (ra > 0) { ctx.save(); ctx.globalAlpha *= ra; radar(t, VR, st); ctx.restore(); }
  // Petrov künye kartı
  const pk = win(t, 18.8, 21.8, .4, .3);
  if (pk > 0) {
    const cx = VR.x + 22, cy = VR.y + VR.h - 150;
    ctx.save(); ctx.globalAlpha *= pk * ra;
    ctx.fillStyle = "rgba(6,8,11,0.88)"; ctx.fillRect(cx, cy, 470, 100); ctx.fillStyle = C.ink; ctx.fillRect(cx, cy, 3, 100);
    text("STANISLAV PETROV", cx + 22, cy + 46, { f: F.d, w: 800, size: 34, c: C.ink, ls: 1 });
    text("YARBAY · NÖBETÇİ SUBAY", cx + 22, cy + 78, { f: F.m, size: 16, c: C.dim, ls: 2 });
    ctx.restore();
  }
  // kaynağa dönüş: Putin bu örneği kullandı
  const pa = eIO(prog(t, 21.85, 22.3));
  if (pa > 0) { ctx.save(); ctx.globalAlpha *= pa; sourcePlate(t, VR, { label: "PUTİN · PETROV ÖRNEĞİ" }); ctx.restore(); }
  ctx.restore();
  frameMarks(t, VR, a);
  // tipografi
  headline(t, 15.05, 16.75, [{ s: "26 EYLÜL 1983", f: F.m, w: 500, max: 92, ls: 2 }]);
  const tab = (row, y, k, c2) => {
    if (k <= 0) return;
    text(row[0], L.x, y, { f: F.d, w: 900, size: 76, c: C.ink, a: k, ls: -1 });
    const w0 = 360; line(L.x + w0 - 10, y - 26, L.x + w0 + lerp(0, 90, k), y - 26, C.dim, 2, k);
    ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = C.dim; ctx.beginPath(); ctx.moveTo(L.x + w0 + 90 * k, y - 34); ctx.lineTo(L.x + w0 + 90 * k + 14, y - 26); ctx.lineTo(L.x + w0 + 90 * k, y - 18); ctx.fill(); ctx.restore();
    text(row[1], L.x + w0 + 130, y, { f: F.d, w: 900, size: 76, c: c2, a: k, ls: -1 });
  };
  const tOut = 1 - eIn(prog(t, 20.1, 20.4));
  if (t > 16.8 && t < 20.4) {
    ctx.save(); ctx.globalAlpha = tOut;
    tab(["SİSTEM", "SALDIRI"], L.hy + 82, eOut(prog(t, 16.85, 17.3)), C.alert);
    tab(["PETROV", "ŞÜPHE"], L.hy + 182, eOut(prog(t, 18.85, 19.3)), C.ana);
    ctx.restore();
  }
  headline(t, 20.45, 21.85, [{ s: "ALARM YANLIŞTI.", w: 900, max: 112 }]);
  headline(t, 21.95, 25.0, [
    { s: "AI PETROV'UN", f: F.r, it: true, w: 400, max: 112, gap: .02 },
    { s: "YERİNDE OLSAYDI?", f: F.r, it: true, w: 400, max: 112, c: C.ana }
  ]);
}

function sceneEnergy(t) {
  if (t < 24.95 || t > 35.4) return;
  const a = win(t, 25.0, 35.3, 0, .3);
  ctx.save(); ctx.globalAlpha = a; clipRect(VR);
  ctx.fillStyle = "#06080b"; ctx.fillRect(VR.x, VR.y, VR.w, VR.h);
  // sinir ağı genişleyerek veri merkezine dönüşür
  const nz = prog(t, 25.0, 26.0);
  if (nz < 1) { ctx.save(); ctx.globalAlpha *= 1 - eIn(nz); neural(t, VR, { scale: 1 + eIn(nz) * 2.6, speed: 2 }); ctx.restore(); }
  const ra = eOut(prog(t, 25.5, 26.3)) * (1 - eIO(prog(t, 28.6, 29.4)));
  if (ra > 0) racks(t, VR, eOut(prog(t, 25.7, 28.0)), ra, lerp(1.25, .95, eOut(prog(t, 25.5, 29.0))));
  const ga = eOut(prog(t, 28.8, 29.6));
  if (ga > 0) powerGrid(t, VR, prog(t, 28.9, 31.4), ga * (1 - .55 * eOut(prog(t, 31.6, 32.1))));
  // denklem
  const eq = prog(t, 31.6, 35);
  if (eq > 0) {
    ctx.fillStyle = `rgba(4,6,8,${.55 * eOut(prog(t, 31.6, 32.0))})`; ctx.fillRect(VR.x, VR.y, VR.w, VR.h);
    const cx = VR.x + VR.w / 2; let y = VR.y + 150;
    const k0 = eExp(prog(t, 31.65, 32.2));
    text("AI", cx, y + (1 - k0) * 30, { f: F.d, w: 900, size: 132, c: C.ink, align: "center", a: k0, ls: -2 });
    line(cx - 160 * k0, y + 42, cx + 160 * k0, y + 42, C.ana, 2);
    const items = ["COMPUTE", "ENERJİ", "ALTYAPI"];
    items.forEach((s, i) => {
      const k = eExp(prog(t, 32.1 + i * .3, 32.6 + i * .3)), yy = y + 140 + i * 128;
      if (i > 0) text("+", cx, yy - 76, { f: F.d, w: 300, size: 54, c: C.ana, align: "center", a: k });
      text(s, cx, yy + (1 - k) * 20, { f: F.d, w: 800, size: 74, c: C.ink, align: "center", a: k, ls: 2 });
    });
  }
  ctx.restore();
  // kısa kaynak dönüşü (köşe ekran)
  const pa = win(t, 30.1, 31.9, .3, .3);
  if (pa > 0) { ctx.save(); ctx.globalAlpha = pa; const pr = { x: VR.x + VR.w - 340, y: VR.y + 24, w: 316, h: 200 }; ctx.fillStyle = "#000"; ctx.fillRect(pr.x - 4, pr.y - 4, pr.w + 8, pr.h + 8); sourcePlate(t, pr, { mini: true }); ctx.restore(); }
  frameMarks(t, VR, a);
  headline(t, 25.35, 28.55, [{ s: "AI SADECE", w: 900, max: 112, gap: .02 }, { s: "YAZILIM DEĞİL.", w: 900, max: 112 }]);
  headline(t, 28.65, 34.95, [{ s: "ENERJİ + COMPUTE + ALTYAPI", w: 900, max: 100, c: C.ink }], { y: L.hy + 40 });
}

function sceneWar(t) {
  if (t < 34.95 || t > 46.4) return;
  const a = win(t, 35.0, 46.3, .4, .35);
  const accel = eIn(prog(t, 39.5, 45.6));
  ctx.save(); ctx.globalAlpha = a; clipRect(VR);
  ctx.fillStyle = "#06080b"; ctx.fillRect(VR.x, VR.y, VR.w, VR.h);
  // veri merkezi bağlantıları → komuta bağlantıları (hatların dönüşümü)
  const morph = prog(t, 35.0, 36.0);
  if (morph < 1) { ctx.save(); ctx.globalAlpha *= 1 - eIO(morph); powerGrid(t, VR, 1, 1); ctx.restore(); }
  const shrink = eIO(prog(t, 38.0, 38.9));
  const nr = { x: lerp(VR.x, VR.x + 420, shrink), y: lerp(VR.y + 20, VR.y + 60, shrink), w: lerp(VR.w, VR.w - 440, shrink), h: lerp(VR.h - 40, VR.h - 140, shrink) };
  commandNet(t, nr, prog(t, 35.3, 37.6), 1, 1 + accel * 6);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a;
  const ck = prog(t, 38.3, 39.4);
  if (ck > 0) {
    killChain(t, VR.x + 30, VR.y + 70, 250, ck, accel);
    // hız göstergesi
    const sx = VR.x + 30, sy = VR.y + VR.h - 48;
    text("KARAR HIZI", sx, sy - 14, { f: F.m, w: 600, size: 14, c: C.dim, ls: 2, a: ck });
    line(sx, sy, sx + 250, sy, C.hair, 4, ck);
    ctx.fillStyle = accel > .7 ? C.alert : C.ana; ctx.globalAlpha = a * ck; ctx.fillRect(sx, sy - 2, 250 * (.12 + .88 * accel), 4);
  }
  ctx.restore();
  frameMarks(t, VR, a);
  headline(t, 36.3, 40.6, [{ s: "TEK BİR KARAR AĞI", w: 900, max: 100 }], { y: L.hy + 40 });
  headline(t, 40.7, 45.95, [
    { s: "SAVAŞ MAKİNE", f: F.r, it: true, w: 400, max: 112, gap: .02 },
    { s: "HIZINA ÇIKARSA?", f: F.r, it: true, w: 400, max: 112, c: C.alert }
  ]);
}

function sceneAnalysis(t) {
  if (t < 45.9 || t > 55.4) return;
  const a = win(t, 46.0, 55.25, .5, .4);
  ctx.save(); ctx.globalAlpha = a; clipRect(VR);
  ctx.fillStyle = "#05070a"; ctx.fillRect(VR.x, VR.y, VR.w, VR.h);
  const lk = prog(t, 49.6, 51.6);
  globe(t, VR, 1 - .78 * eIO(prog(t, 49.4, 50.2)));
  if (lk > 0) layers(t, VR, lk, prog(t, 52.2, 53.4));
  ctx.restore();
  frameMarks(t, VR, a);
  headline(t, 46.35, 49.85, [{ s: "BURADAKİ MESELE", w: 900, max: 100, gap: .04 }, { s: "YALNIZCA AI DEĞİL.", w: 900, max: 100 }]);
  headline(t, 49.95, 55.0, [
    { s: "TEKNOLOJİK GÜCÜ", f: F.r, it: true, w: 400, max: 112, gap: .02 },
    { s: "KİM KONTROL EDİYOR?", f: F.r, it: true, w: 400, max: 112, c: C.ana }
  ]);
}

function sceneOutro(t) {
  if (t < 55.0) return;
  const words = ["HESAPLAMA.", "ENERJİ.", "KARAR."];
  const conv = eIO(prog(t, 56.35, 56.85)), up = eIO(prog(t, 57.45, 58.0));
  const cx = W / 2;
  ctx.save(); ctx.globalAlpha = 1 - up;
  words.forEach((w, i) => {
    const k = eExp(prog(t, 55.15 + i * .4, 55.6 + i * .4)); if (k <= 0) return;
    const y0 = 700 + i * 130, y = lerp(y0, 1010, conv);
    ctx.save(); ctx.globalAlpha *= k * (1 - conv);
    text(w, cx, y + (1 - k) * 40, { f: F.d, w: 800, size: 92, c: C.ink, align: "center", ls: 2 });
    ctx.restore();
    if (t > 56.0 && conv < 1) line(cx, y0 + 30, cx, lerp(y0 + 30, 1000, eIO(prog(t, 56.0, 56.6))), rgba(C.ana, .7), 1.5, 1 - conv);
  });
  const gk = eExp(prog(t, 56.65, 57.2));
  if (gk > 0) {
    glow(cx, 960, 360 * gk, rgba(C.ana, .12));
    text("GÜÇ.", cx, 1010 + (1 - gk) * 40, { f: F.d, w: 900, size: 220, c: C.ink, align: "center", a: gk, ls: -4 });
  }
  ctx.restore();
  const wk = eOut(prog(t, 57.75, 58.3)), qk = eOut(prog(t, 58.05, 58.6)), fk = eOut(prog(t, 58.4, 58.9));
  text("TEKNOPOLİTİKA", cx, 760, { f: F.d, w: 800, size: 64, c: C.ink, align: "center", ls: 14, a: wk });
  line(cx - 60 * wk, 800, cx + 60 * wk, 800, C.ana, 2, wk);
  text("AI çağında egemenlik,", cx, 900 + (1 - qk) * 16, { f: F.r, it: true, w: 400, size: 62, c: C.ink, align: "center", a: qk });
  text("karar zincirinin neresinde başlıyor?", cx, 975 + (1 - qk) * 16, { f: F.r, it: true, w: 400, size: 54, c: C.ana, align: "center", a: qk });
  text("Teknoloji  •  Jeopolitik  •  Güç", cx, 1380, { f: F.m, w: 500, size: 22, c: C.dim, align: "center", ls: 3, a: fk });
}

/* ================================================================
   ANA ÇİZİM
   ================================================================ */
let VIG = null;
async function renderFrame(t) {
  await seekPlate(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // ince ızgara
  if (t < 55) { ctx.save(); ctx.globalAlpha = .5 * (1 - prog(t, 54.6, 55)); ctx.strokeStyle = "rgba(236,232,224,0.035)"; ctx.lineWidth = 1; for (let x = 80; x <= 1000; x += 46) line(x, 0, x, H, "rgba(236,232,224,0.03)"); ctx.restore(); }
  sceneHook(t); sceneHumanMachine(t); scenePetrov(t); sceneEnergy(t); sceneWar(t); sceneAnalysis(t); sceneOutro(t);
  lowerThirds(t);
  header(t);
  // vinyet + gren + giriş/çıkış
  if (!VIG) { VIG = ctx.createRadialGradient(W / 2, H * .45, H * .3, W / 2, H * .5, H * .78); VIG.addColorStop(0, "rgba(0,0,0,0)"); VIG.addColorStop(1, "rgba(0,0,0,0.55)"); }
  ctx.fillStyle = VIG; ctx.fillRect(0, 0, W, H);
  grain(t, .07);
  const fade = Math.max(1 - prog(t, 0, .25), prog(t, 59.25, 59.95));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = renderFrame;
window.LT_CHECK = () => LT.map(c => ({ t: c[0], n: wrap(c[3], ltFont(c[3]), L.ltW - 24).length, size: ltFont(c[3]).size }));

/* ---------------- önizleme oynatıcısı ---------------- */
const isRender = new URLSearchParams(location.search).has("render");
if (isRender) document.body.classList.add("render");
const fontsReady = (async () => {
  const faces = ['900 40px "TP Display"', '800 40px "TP Display"', '700 40px "TP Display"', '300 40px "TP Display"', '400 40px "TP Sans"', '500 40px "TP Sans"', '600 40px "TP Sans"', '400 40px "TP Serif"', 'italic 400 40px "TP Serif"', '400 40px "TP Mono"', '500 40px "TP Mono"', '600 40px "TP Mono"'];
  await Promise.all(faces.map(f => document.fonts.load(f, "İŞĞÜÖÇâ")));
  if (plateVideo) await new Promise(r => plateVideo.readyState >= 2 ? r() : plateVideo.addEventListener("loadeddata", r, { once: true }));
  window.READY = true;
})();
if (!isRender) {
  const btn = document.getElementById("play"), sc = document.getElementById("scrub"), tc = document.getElementById("tc");
  let playing = false, t0 = 0, start = 0, cur = 0, busy = false;
  const draw = async t => { if (busy) return; busy = true; cur = t; await renderFrame(t); sc.value = t; tc.textContent = t.toFixed(2).padStart(5, "0"); busy = false; };
  const loop = now => { if (!playing) return; const t = t0 + (now - start) / 1000; if (t >= DUR) { playing = false; btn.textContent = "▶ OYNAT"; draw(DUR - .01); return; } draw(t); requestAnimationFrame(loop); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? "❚❚ DURAKLAT" : "▶ OYNAT"; if (playing) { t0 = cur >= DUR - .05 ? 0 : cur; start = performance.now(); requestAnimationFrame(loop); } };
  sc.oninput = () => { playing = false; btn.textContent = "▶ OYNAT"; draw(+sc.value); };
  fontsReady.then(() => draw(2.2));
}
